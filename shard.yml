name: crystal-asciidoctor-pdf
version: 2.3.24.107

description: |
  AsciiDoc to PDF converter for Crystal, equivalent of the asciidoctor-pdf Ruby gem.
  Depends on crystal-asciidoctor (parser/AST) and pdf (PDF engine).
  Ported from Ruby asciidoctor-pdf 2.3.24 (2025-11-15).
  Synchronized with Ruby asciidoctor 2.0.26 (parser) via crystal-asciidoctor dependency.

authors:
  - papilip <papilip@aloli.fr>

license: MIT

# Pour le développement local, remplacer par :
#   crystal-asciidoctor:
#     path: ../crystal-asciidoctor
#   pdf:
#     path: ../pdf
dependencies:
  crystal-asciidoctor:
    github: aloli-crystal/crystal-asciidoctor
    version: "~> 2.0.26.10"
  pdf:
    github: aloli-crystal/pdf
    version: "~> 1.20.1"
  crystal-rouge:
    github: aloli-crystal/crystal-rouge
    version: "~> 4.7"
  country-flags:
    github: aloli-crystal/country-flags
    version: "~> 0.1.4"
  emojis:
    github: aloli-crystal/emojis
    version: "~> 0.2.2"
  noto-cjk:
    github: aloli-crystal/noto-cjk
    version: "~> 0.1.2"

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.6"

targets:
  crystal-asciidoctor-pdf:
    main: src/cli.cr

crystal: ">= 1.19.0"
