name: CI

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.21.1"

      - name: Install dependencies
        run: shards install

      - name: Run tests
        run: crystal spec

      - name: Run linter
        run: crystal run lib/ameba/bin/ameba.cr --
