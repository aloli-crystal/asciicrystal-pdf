Naming/QueryBoolMethods:
  Enabled: false
  # Les properties booléennes du thème YAML utilisent property (pas property?)
  # pour rester compatibles avec le format YAML de chargement des thèmes.

Naming/BlockParameterName:
  Enabled: false

Style/NegatedConditionsInUnless:
  Enabled: false

Style/ParenthesesAroundCondition:
  Enabled: false

Style/UnlessElse:
  Enabled: false

Lint/NotNil:
  Enabled: false

Lint/UselessAssign:
  Enabled: false

Lint/Formatting:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false
  # Le converter AsciiDoc→PDF a une complexité cyclomatique élevée
  # par nature (dispatch sur de nombreux types de blocs).

Lint/UnusedArgument:
  Enabled: false

Performance/ChainedCallWithNoBang:
  Enabled: false

# Ameba 1.7 : changer les marqueurs de heredoc modifierait l'interpolation ; désactivé plutôt que converti.
Style/HeredocEscape:
  Enabled: false

Style/MultilineStringLiteral:
  Enabled: false

# Ameba 1.7 : la correction automatique de cette règle change le CONTENU des
# heredocs dont les lignes sont volontairement décalées (documents AsciiDoc et
# YAML des specs) — constaté le 16 oct. 2026. Désactivée plutôt qu'appliquée.
Style/HeredocIndent:
  Enabled: false
